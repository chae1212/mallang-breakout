<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>말랑 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --bg1: #fff6fb; --bg2: #ffe1ee; --bg3: #f3dcff; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 15%, var(--bg1), var(--bg2) 55%, var(--bg3));
    font-family: 'Jua', sans-serif; -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; border-radius: 24px; box-shadow: 0 14px 40px rgba(220, 110, 160, .35); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 480, H = 640, HUD = 58;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- 데이터 ----------
const PALETTE = ['#ff9ec4', '#ffc59e', '#ffe78f', '#b8f2a6', '#9fe6f5', '#a9c4ff', '#c9b3ff'];
const LEVELS = [
  ['11111111', '11111111', '11111111', '11111111'],
  ['.11..11.', '11111111', '11222211', '11111111', '.111111.', '..1111..', '...11...'],
  ['..1111..', '.111111.', '11211211', '11111111', '1.1111.1', '11....11', '.111111.'],
  ['22222222', '1......1', '1.2112.1', '1.1221.1', '1......1', '22222222'],
  ['1.1.1.1.', '.2.2.2.2', '1.1.1.1.', '.2.2.2.2', '1.1.1.1.', '.1.1.1.1'],
];
const COLS = 8, GAP = 6, MX = 24, TOP = 92, BH = 26;
const BW = (W - MX * 2 - GAP * (COLS - 1)) / COLS;
const BASE_W = 96, WIDE_W = 150, MAX_SPEED = 640;
const SND = { x: W - 30, y: H - 24 };

let state = 'title', paused = false;
let score = 0, best = 0, lives = 3, level = 0, combo = 0;
let bricks = [], balls = [], drops = [], parts = [], texts = [];
let keys = {}, pointerX = null, stateT = 0, shake = 0, t = 0;
const paddle = { x: W / 2, y: H - 58, w: BASE_W, tw: BASE_W, h: 18, squish: 0, wideT: 0 };
try { best = +localStorage.getItem('mallang-best') || 0; } catch (e) {}

// ---------- 사운드 ----------
let actx = null, muted = false;
function beep(f, d = 0.08, type = 'sine', v = 0.12, slide = 1.5) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const now = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, now);
    o.frequency.exponentialRampToValueAtTime(f * slide, now + d);
    g.gain.setValueAtTime(v, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + d);
    o.connect(g).connect(actx.destination);
    o.start(now); o.stop(now + d);
  } catch (e) {}
}
function melody(notes, gap = 0.09, type = 'triangle') {
  notes.forEach((f, i) => setTimeout(() => beep(f, 0.14, type, 0.12, 1.01), i * gap * 1000));
}

// ---------- 게임 로직 ----------
function baseSpeed() { return Math.min(340 + level * 22, 520); }

function loadLevel() {
  bricks = [];
  LEVELS[level % LEVELS.length].forEach((row, r) => {
    [...row].forEach((ch, c) => {
      if (ch === '.') return;
      const hp = ch === '2' ? 2 : 1;
      bricks.push({
        x: MX + c * (BW + GAP), y: TOP + r * (BH + GAP), w: BW, h: BH,
        hp, max: hp, color: PALETTE[r % PALETTE.length], wob: 0, blink: Math.random() * 4,
      });
    });
  });
  drops = [];
  paddle.tw = BASE_W; paddle.wideT = 0;
  resetBall();
}

function resetBall() {
  balls = [{ x: paddle.x, y: paddle.y - paddle.h / 2 - 9, vx: 0, vy: 0, r: 9, stuck: true, trail: [] }];
  combo = 0;
}

function launch() {
  for (const b of balls) {
    if (!b.stuck) continue;
    const a = Math.random() * 0.6 - 0.3, sp = baseSpeed();
    b.vx = sp * Math.sin(a); b.vy = -sp * Math.cos(a); b.stuck = false;
    beep(660, 0.1, 'triangle');
  }
}

function newGame() {
  score = 0; lives = 3; level = 0;
  paddle.w = BASE_W; parts = []; texts = [];
  loadLevel();
  state = 'play'; paused = false;
}

function action() {
  if (state === 'title' || state === 'over') { if (stateT > 0.4) newGame(); return; }
  if (state === 'play') { if (paused) { paused = false; return; } launch(); }
}

function burst(x, y, n, color, type) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 1, decay: 1.2 + Math.random(),
      color, type: type || (Math.random() < 0.5 ? 'star' : 'heart'),
      size: 5 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8,
    });
  }
}
function popText(x, y, txt, color = '#ff6fa5') { texts.push({ x, y, txt, color, life: 1 }); }

function hitBrick(k) {
  k.hp--; k.wob = 1; combo++;
  beep(520 + Math.min(combo, 12) * 60, 0.09, 'sine', 0.13);
  if (k.hp > 0) { burst(k.x + k.w / 2, k.y + k.h / 2, 4, '#ffffff', 'circle'); return; }
  const pts = 10 * k.max * Math.min(combo, 5);
  score += pts; shake = Math.max(shake, 3);
  popText(k.x + k.w / 2, k.y + k.h / 2, '+' + pts + (combo >= 3 ? ' x' + Math.min(combo, 5) : ''));
  burst(k.x + k.w / 2, k.y + k.h / 2, 10, k.color);
  if (Math.random() < 0.14) {
    const r = Math.random(), type = r < 0.25 ? 'heart' : r < 0.62 ? 'wide' : 'multi';
    drops.push({ x: k.x + k.w / 2, y: k.y + k.h / 2, type, t: 0 });
  }
  if (bricks.every(b => b.hp <= 0)) {
    state = 'clear'; stateT = 0;
    score += 100 + lives * 20;
    melody([523, 659, 784, 1047]);
    for (let i = 0; i < 4; i++) burst(80 + i * 107, 300, 14, PALETTE[i * 2 % PALETTE.length]);
  }
}

function applyPower(type) {
  const px = paddle.x, py = paddle.y - 30;
  if (type === 'heart') {
    lives = Math.min(lives + 1, 5); popText(px, py, '생명 +1 ♥', '#ff5c93');
  } else if (type === 'wide') {
    paddle.tw = WIDE_W; paddle.wideT = 12; popText(px, py, '쭈욱~!', '#4f8cff');
  } else {
    launch();
    const add = [];
    for (const b of balls) {
      const sp = Math.hypot(b.vx, b.vy), a = Math.atan2(b.vx, -b.vy);
      for (const s of [-0.45, 0.45]) {
        if (balls.length + add.length >= 6) break;
        add.push({ x: b.x, y: b.y, vx: sp * Math.sin(a + s), vy: -sp * Math.cos(a + s), r: 9, stuck: false, trail: [] });
      }
    }
    balls.push(...add); popText(px, py, '뿅뿅뿅!', '#e0a800');
  }
  melody([784, 988, 1175], 0.06, 'sine');
  burst(px, paddle.y - 10, 8, '#ffd1e4');
}

function updateBall(b, dt) {
  if (b.stuck) { b.x = paddle.x; b.y = paddle.y - paddle.h / 2 - b.r; return; }
  const sp = Math.hypot(b.vx, b.vy);
  const steps = Math.max(1, Math.ceil(sp * dt / 4)), sdt = dt / steps;
  for (let i = 0; i < steps; i++) {
    const px = b.x, py = b.y;
    b.x += b.vx * sdt; b.y += b.vy * sdt;

    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); beep(330, 0.05, 'sine', 0.06); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(330, 0.05, 'sine', 0.06); }
    if (b.y < HUD + b.r) { b.y = HUD + b.r; b.vy = Math.abs(b.vy); beep(330, 0.05, 'sine', 0.06); }

    const top = paddle.y - paddle.h / 2;
    if (b.vy > 0 && b.y + b.r >= top && py + b.r <= top + 10 &&
        Math.abs(b.x - paddle.x) <= paddle.w / 2 + b.r) {
      const rel = Math.max(-1, Math.min(1, (b.x - paddle.x) / (paddle.w / 2)));
      const ang = rel * 1.05, s = Math.min(sp + 5, MAX_SPEED);
      b.vx = s * Math.sin(ang); b.vy = -s * Math.cos(ang);
      b.y = top - b.r;
      paddle.squish = 1; combo = 0;
      beep(440, 0.08, 'triangle', 0.12);
      burst(b.x, b.y + b.r, 3, '#ffffff', 'circle');
      continue;
    }

    for (const k of bricks) {
      if (k.hp <= 0) continue;
      const cx = Math.max(k.x, Math.min(b.x, k.x + k.w));
      const cy = Math.max(k.y, Math.min(b.y, k.y + k.h));
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy >= b.r * b.r) continue;
      const outX = px < k.x || px > k.x + k.w, outY = py < k.y || py > k.y + k.h;
      if (outX && !outY) b.vx = -b.vx;
      else if (outY && !outX) b.vy = -b.vy;
      else if (Math.abs(dx) > Math.abs(dy)) b.vx = -b.vx;
      else b.vy = -b.vy;
      // 너무 수평으로 흐르지 않게
      const s2 = Math.hypot(b.vx, b.vy);
      if (Math.abs(b.vy) < s2 * 0.25) {
        b.vy = Math.sign(b.vy || 1) * s2 * 0.25;
        b.vx = Math.sign(b.vx) * Math.sqrt(s2 * s2 - b.vy * b.vy);
      }
      b.x = px; b.y = py;
      hitBrick(k);
      break;
    }
    if (state !== 'play') return;
    if (b.y - b.r > H) { b.dead = true; return; }
  }
  b.trail.push({ x: b.x, y: b.y });
  if (b.trail.length > 8) b.trail.shift();
}

function update(dt) {
  t += dt; stateT += dt;
  shake = Math.max(0, shake - dt * 30);

  for (const p of parts) { p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const x of texts) { x.y -= 40 * dt; x.life -= dt * 0.9; }
  texts = texts.filter(x => x.life > 0);
  for (const k of bricks) k.wob = Math.max(0, k.wob - dt * 3);

  if (state === 'clear' && stateT > 2) { level++; loadLevel(); state = 'play'; }
  if (state !== 'play' || paused) return;

  const spd = 540;
  if (keys.ArrowLeft || keys.a) { paddle.x -= spd * dt; pointerX = null; }
  if (keys.ArrowRight || keys.d) { paddle.x += spd * dt; pointerX = null; }
  if (pointerX !== null) paddle.x += (pointerX - paddle.x) * Math.min(1, dt * 20);
  if (paddle.wideT > 0) { paddle.wideT -= dt; if (paddle.wideT <= 0) paddle.tw = BASE_W; }
  paddle.w += (paddle.tw - paddle.w) * Math.min(1, dt * 8);
  paddle.x = Math.max(paddle.w / 2 + 6, Math.min(W - paddle.w / 2 - 6, paddle.x));
  paddle.squish = Math.max(0, paddle.squish - dt * 5);

  for (const b of balls) { updateBall(b, dt); if (state !== 'play') return; }
  balls = balls.filter(b => !b.dead);
  if (balls.length === 0) {
    lives--; shake = 8;
    if (lives <= 0) {
      state = 'over'; stateT = 0;
      if (score > best) { best = score; try { localStorage.setItem('mallang-best', best); } catch (e) {} }
      melody([523, 440, 349, 262], 0.16, 'sine');
    } else {
      paddle.tw = BASE_W; paddle.wideT = 0; drops = [];
      resetBall();
      melody([440, 330], 0.12, 'sine');
    }
  }

  for (const d of drops) {
    d.y += 150 * dt; d.t += dt;
    if (d.y + 13 >= paddle.y - paddle.h / 2 && d.y - 13 <= paddle.y + paddle.h / 2 &&
        Math.abs(d.x - paddle.x) < paddle.w / 2 + 13) { d.dead = true; applyPower(d.type); }
    if (d.y > H + 20) d.dead = true;
  }
  drops = drops.filter(d => !d.dead);
}

// ---------- 그리기 ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function mix(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function heartPath(x, y, s) { // (x, y) = 중심
  y -= s / 2;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
  ctx.closePath();
}
function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function label(txt, x, y, size, color = '#6b3a55', stroke = '#ffffff', align = 'center') {
  ctx.font = `${size}px Jua, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = size * 0.22; ctx.strokeStyle = stroke; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = color; ctx.fillText(txt, x, y);
}

function drawFace(x, y, mood, blink, s = 1) {
  const ink = '#5a3a4a', ex = 7 * s, ey = -3 * s;
  ctx.fillStyle = ink; ctx.strokeStyle = ink; ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
  ctx.beginPath();
  if (mood === 'tough') {
    ctx.moveTo(x - ex - 3 * s, y + ey - 3 * s); ctx.lineTo(x - ex + 2 * s, y + ey); ctx.lineTo(x - ex - 3 * s, y + ey + 3 * s);
    ctx.moveTo(x + ex + 3 * s, y + ey - 3 * s); ctx.lineTo(x + ex - 2 * s, y + ey); ctx.lineTo(x + ex + 3 * s, y + ey + 3 * s);
    ctx.stroke();
  } else if (mood === 'ouch' || blink) {
    ctx.moveTo(x - ex - 3 * s, y + ey); ctx.lineTo(x - ex + 3 * s, y + ey);
    ctx.moveTo(x + ex - 3 * s, y + ey); ctx.lineTo(x + ex + 3 * s, y + ey);
    ctx.stroke();
  } else {
    ctx.arc(x - ex, y + ey, 2.4 * s, 0, Math.PI * 2);
    ctx.moveTo(x + ex + 2.4 * s, y + ey);
    ctx.arc(x + ex, y + ey, 2.4 * s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();
  if (mood === 'ouch') { ctx.arc(x, y + 3.5 * s, 2 * s, 0, Math.PI * 2); ctx.stroke(); }
  else { ctx.arc(x, y + 0.5 * s, 3.2 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,110,150,.45)';
  ctx.beginPath(); ctx.ellipse(x - ex - 4 * s, y + 2.5 * s, 3.2 * s, 2 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + ex + 4 * s, y + 2.5 * s, 3.2 * s, 2 * s, 0, 0, Math.PI * 2); ctx.fill();
  if (mood === 'ouch') { // 땀방울
    ctx.fillStyle = '#8fd3ff';
    ctx.beginPath(); ctx.moveTo(x + ex + 9 * s, y - 9 * s);
    ctx.quadraticCurveTo(x + ex + 13 * s, y - 3 * s, x + ex + 9 * s, y - 2 * s);
    ctx.quadraticCurveTo(x + ex + 5 * s, y - 3 * s, x + ex + 9 * s, y - 9 * s); ctx.fill();
  }
}

function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#fff8fc'); g.addColorStop(1, '#ffe4f0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,170,205,.18)';
  const off = (t * 8) % 40;
  for (let y = -40; y < H + 40; y += 40)
    for (let x = 0; x < W + 40; x += 40) {
      ctx.beginPath(); ctx.arc(x + ((y / 40) % 2 ? 20 : 0), y + off, 3, 0, Math.PI * 2); ctx.fill();
    }
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 3; i++) {
    const cx = ((t * (10 + i * 6) + i * 190) % (W + 160)) - 80, cy = 170 + i * 150;
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.arc(cx + 20, cy - 8, 22, 0, Math.PI * 2); ctx.arc(cx + 42, cy, 17, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHUD() {
  rr(10, 8, W - 20, 42, 21);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#ffc2da'; ctx.stroke();
  label('점수 ' + score, 30, 30, 20, '#c2457a', null, 'left');
  label('Lv.' + (level + 1), W / 2, 30, 20, '#8a5cc7', null);
  for (let i = 0; i < lives; i++) {
    heartPath(W - 34 - i * 24, 30, 18); ctx.fillStyle = '#ff6f9f'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#e04a80'; ctx.stroke();
  }
  // 소리 버튼
  ctx.beginPath(); ctx.arc(SND.x, SND.y, 15, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill(); ctx.strokeStyle = '#ffc2da'; ctx.lineWidth = 2; ctx.stroke();
  label('♪', SND.x, SND.y + 1, 18, muted ? '#c9b0bd' : '#c2457a', null);
  if (muted) {
    ctx.beginPath(); ctx.moveTo(SND.x - 9, SND.y - 9); ctx.lineTo(SND.x + 9, SND.y + 9);
    ctx.strokeStyle = '#c2457a'; ctx.lineWidth = 2.5; ctx.stroke();
  }
}

function drawBrick(k) {
  const w = 1 + Math.sin(k.wob * 12) * k.wob * 0.14;
  ctx.save();
  ctx.translate(k.x + k.w / 2, k.y + k.h / 2); ctx.scale(w, 2 - w);
  rr(-k.w / 2, -k.h / 2, k.w, k.h, 9);
  ctx.fillStyle = k.color; ctx.fill();
  const tough = k.max === 2;
  ctx.lineWidth = tough ? 3.5 : 2.5;
  ctx.strokeStyle = mix(k.color, '#7a3d5c', tough ? 0.45 : 0.25); ctx.stroke();
  rr(-k.w / 2 + 5, -k.h / 2 + 4, k.w - 18, 5, 3);
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
  if (tough && k.hp === 2) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    starPath(k.w / 2 - 8, -k.h / 2 + 7, 4); ctx.fill();
  }
  const mood = !tough ? 'happy' : k.hp === 2 ? 'tough' : 'ouch';
  drawFace(0, 3, mood, (t + k.blink) % 4 < 0.13, 0.9);
  ctx.restore();
}

function drawPaddle() {
  const p = paddle, sq = p.squish;
  ctx.save();
  ctx.translate(p.x, p.y); ctx.scale(1 + sq * 0.12, 1 - sq * 0.25);
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 12, -p.h / 2 + 3); ctx.lineTo(s * 22, -p.h / 2 - 12); ctx.lineTo(s * 30, -p.h / 2 + 3);
    ctx.closePath();
    ctx.fillStyle = '#ff9ec4'; ctx.fill(); ctx.strokeStyle = '#e0628f'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s * 17, -p.h / 2 + 1); ctx.lineTo(s * 22, -p.h / 2 - 6); ctx.lineTo(s * 26, -p.h / 2 + 1);
    ctx.closePath(); ctx.fillStyle = '#ffd1e4'; ctx.fill();
  }
  rr(-p.w / 2, -p.h / 2, p.w, p.h, p.h / 2);
  ctx.fillStyle = paddle.wideT > 0 ? '#ffb3d1' : '#ff9ec4'; ctx.fill();
  ctx.strokeStyle = '#e0628f'; ctx.lineWidth = 2.5; ctx.stroke();
  rr(-p.w / 2 + 8, -p.h / 2 + 3, p.w - 16, 4, 2);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  drawFace(0, 2, 'happy', t % 3.5 < 0.13, 0.75);
  ctx.restore();
}

function drawBall(b) {
  b.trail.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, b.r * (i + 1) / b.trail.length * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,214,102,${(i + 1) / b.trail.length * 0.3})`; ctx.fill();
  });
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe27a'; ctx.fill(); ctx.strokeStyle = '#f0b429'; ctx.lineWidth = 2; ctx.stroke();
  const s = b.r / 9;
  ctx.beginPath(); ctx.arc(b.x - 3 * s, b.y - 3.5 * s, 2.2 * s, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
  drawFace(b.x, b.y + 1.5 * s, 'happy', b.blink && t % 3 < 0.15, 0.45 * s);
}

function drawDrop(d) {
  const x = d.x + Math.sin(d.t * 5) * 3, y = d.y;
  const col = d.type === 'heart' ? '#ff6f9f' : d.type === 'wide' ? '#6aa0ff' : '#f0b429';
  ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
  if (d.type === 'heart') { heartPath(x, y + 1, 14); ctx.fillStyle = col; ctx.fill(); }
  else if (d.type === 'wide') {
    ctx.beginPath();
    ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y);
    ctx.moveTo(x - 3, y - 4); ctx.lineTo(x - 7, y); ctx.lineTo(x - 3, y + 4);
    ctx.moveTo(x + 3, y - 4); ctx.lineTo(x + 7, y); ctx.lineTo(x + 3, y + 4);
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();
  } else {
    ctx.fillStyle = col;
    for (const [dx, dy] of [[-5, 3], [5, 3], [0, -4]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, 3.3, 0, Math.PI * 2); ctx.fill(); }
  }
}

function drawParts() {
  for (const p of parts) {
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
    if (p.type === 'star') starPath(0, 0, p.size);
    else if (p.type === 'heart') heartPath(0, 0, p.size * 1.6);
    else { ctx.beginPath(); ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2); }
    ctx.fill();
    if (p.color === '#ffffff') { ctx.strokeStyle = '#ffc2da'; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.restore();
  }
  for (const x of texts) {
    ctx.save(); ctx.globalAlpha = Math.min(1, x.life * 2);
    label(x.txt, x.x, x.y, 18, x.color); ctx.restore();
  }
}

function panel(y, h) {
  ctx.fillStyle = 'rgba(255,240,247,.55)'; ctx.fillRect(0, 0, W, H);
  rr(40, y, W - 80, h, 28);
  ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#ffb3d1'; ctx.stroke();
}

function drawOverlay() {
  const blinkOn = Math.floor(t * 2) % 2 === 0;
  if (state === 'title') {
    panel(130, 380);
    const by = 205 + Math.abs(Math.sin(t * 3)) * -22;
    drawBall({ x: W / 2, y: by, r: 22, trail: [], blink: true });
    label('말랑 벽돌깨기', W / 2, 275, 46, '#ff5c93');
    label('마우스·터치·← → 로 움직이고', W / 2, 330, 19, '#7b5a6b', null);
    label('클릭 / 탭 / 스페이스로 공 발사!', W / 2, 358, 19, '#7b5a6b', null);
    label('♥ 생명   ↔ 길쭉   ●●● 여러 공', W / 2, 398, 18, '#a07890', null);
    if (best) label('최고 점수 ' + best, W / 2, 432, 18, '#8a5cc7', null);
    if (blinkOn) label('탭해서 시작!', W / 2, 475, 26, '#ff5c93');
  } else if (state === 'over') {
    panel(170, 300);
    label('앗, 아쉬워요!', W / 2, 230, 40, '#ff5c93');
    drawFace(W / 2, 290, 'ouch', false, 2.2);
    label('점수 ' + score, W / 2, 350, 26, '#c2457a', null);
    label((score >= best && score > 0 ? '✿ 새 최고 기록! ✿' : '최고 점수 ' + best), W / 2, 385, 19, '#8a5cc7', null);
    if (blinkOn) label('탭해서 다시 하기', W / 2, 435, 24, '#ff5c93');
  } else if (state === 'clear') {
    const s = 1 + Math.max(0, 0.4 - stateT) * 1.5;
    ctx.save(); ctx.translate(W / 2, 330); ctx.scale(s, s);
    label('레벨 클리어!', 0, 0, 48, '#ff5c93');
    label('다음 레벨 준비중…', 0, 48, 20, '#8a5cc7');
    ctx.restore();
  } else if (state === 'play') {
    if (paused) {
      panel(250, 130);
      label('잠깐 쉬는 중~', W / 2, 295, 32, '#ff5c93');
      label('탭하면 계속해요', W / 2, 340, 18, '#7b5a6b', null);
    } else if (balls.some(b => b.stuck) && blinkOn) {
      label('탭 / 스페이스로 발사!', W / 2, paddle.y - 60, 20, '#c2457a');
    }
  }
}

function draw() {
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBg();
  if (state !== 'title') {
    for (const k of bricks) if (k.hp > 0) drawBrick(k);
    drops.forEach(drawDrop);
    drawPaddle();
    balls.forEach(drawBall);
  }
  drawParts();
  drawHUD();
  drawOverlay();
  ctx.restore();
}

// ---------- 입력 ----------
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
addEventListener('pointermove', e => { pointerX = toLogical(e).x; });
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e);
  if (Math.hypot(p.x - SND.x, p.y - SND.y) < 22) { muted = !muted; return; }
  pointerX = p.x;
  action();
});
const keyName = e => e.key.length === 1 ? e.key.toLowerCase() : e.key;
addEventListener('keydown', e => {
  const k = keyName(e); keys[k] = true;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!e.repeat) action(); }
  if (k.startsWith('Arrow')) e.preventDefault();
  if (k === 'm') muted = !muted;
  if ((k === 'p' || k === 'Escape') && state === 'play') paused = !paused;
});
addEventListener('keyup', e => { keys[keyName(e)] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
